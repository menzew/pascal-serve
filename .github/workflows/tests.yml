name: Portable checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -c "from pascal_stack.kernels import patch_spec; patch_spec()"
      - run: c++ -O2 -std=c++11 tests/check_q6_packing.cpp -o /tmp/check-q6-packing
      - run: /tmp/check-q6-packing
      - run: python pascal.py kernel-bench --help
